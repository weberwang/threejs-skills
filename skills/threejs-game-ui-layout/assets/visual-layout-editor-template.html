<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="page-sketch-project-root" content="/">
  <title>V4 页面还原草图</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #edf3fb; background: #0c1420; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; overflow: hidden; }
    main { height: 100%; min-width: 680px; display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 12px; padding: 12px; }
    h1 { margin: 0; font-size: 18px; }
    h2 { margin: 0 0 8px; font-size: 14px; }
    button, input, select { font: inherit; }
    button { padding: 7px 11px; color: #fff; background: #28598d; border: 1px solid #6d9fd1; border-radius: 5px; cursor: pointer; }
    button:disabled, select:disabled { opacity: .45; cursor: not-allowed; }
    input[type=text], select { width: 100%; padding: 7px 8px; color: #f5f8fc; background: #0d1828; border: 1px solid #58718e; border-radius: 5px; }
    #stage-frame { position: relative; min-width: 0; min-height: 0; overflow: hidden; background-color: #172536; background-image: linear-gradient(45deg,#1f3043 25%,transparent 25%),linear-gradient(-45deg,#1f3043 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1f3043 75%),linear-gradient(-45deg,transparent 75%,#1f3043 75%); background-size: 28px 28px; background-position: 0 0,0 14px,14px -14px,-14px 0; border: 1px solid #405670; }
    #stage-device { position: absolute; left: 0; top: 0; transform-origin: top left; background: #080d15; overflow: hidden; outline: 2px solid #627b99; }
    #stage-surface { position: absolute; left: 0; top: 0; transform-origin: top left; background: #101827; overflow: hidden; }
    #workspace-controls { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 14px; background: #172438; border: 1px solid #344861; }
    .control-section { display: grid; gap: 9px; }
    .control-row { display: flex; gap: 8px; }
    .control-row > * { flex: 1; min-width: 0; }
    #page-status { overflow-wrap: anywhere; font-size: 13px; color: #c7d5e5; }
    #device-summary, .help { margin: 0; font-size: 12px; color: #aabbd0; line-height: 1.6; }
    #resource-errors { padding: 10px; background: #182538; border: 1px solid #465a72; border-radius: 6px; font-size: 13px; }
    #resource-errors ul { margin: 0; padding-left: 20px; color: #ffb3a9; }
    #resource-errors:empty { display: none; }
    /* 窄窗口仍保持预览和操作左右分离，通过页面横向滚动访问右栏。 */
    @media (max-width: 680px) { body { overflow-x: auto; } }
  </style>
</head>
<body>
  <main id="sketch-workspace">
    <section id="stage-frame" aria-label="正式资源草图预览画布">
      <div id="stage-device"><div id="stage-surface"></div></div>
    </section>
    <aside id="workspace-controls" aria-label="显示树与草图操作">
      <h1>V4 页面还原草图</h1>
      <section class="control-section" aria-label="预览设备">
        <label for="preview-device">预览设备</label>
        <select id="preview-device"></select>
        <label for="device-orientation">设备方向</label>
        <select id="device-orientation"><option value="portrait">竖屏</option><option value="landscape">横屏</option></select>
        <p id="device-summary"></p>
        <button id="toggle-fullscreen" type="button" aria-pressed="false">进入 Web 全屏</button>
      </section>
      <section class="control-section" aria-label="文件与确认">
        <button id="open-sketch" type="button">打开 page-sketch.json</button>
        <button id="toggle-preview" type="button" disabled aria-pressed="false">预览正式效果</button>
        <button id="reset-sketch" type="button" disabled>重置初始布局</button>
        <button id="save-sketch" type="button" disabled>保存草图</button>
        <button id="confirm-sketch" type="button" disabled>确认草图</button>
        <span id="page-status" role="status" aria-live="polite">请从游戏项目开发服务打开此页面并加载草图。</span>
      </section>
      <div id="layout-controls"></div>
      <div id="resource-errors" aria-live="polite"></div>
      <p class="help">左侧仅显示预览和节点对齐框，右侧进行全部操作。设备选择只影响显示尺寸，草图逻辑坐标保持不变；不同宽高比按比例居中留边。保存后点击“确认草图”才能进入 V5。</p>
    </aside>
  </main>
  <script type="module">
    import { initializePageSketchApplication } from "./page-sketch-editor.mjs";

    const rootPath = document.querySelector('meta[name="page-sketch-project-root"]')?.content || "/";
    await initializePageSketchApplication({ document, projectRootUrl: new URL(rootPath, location.href) });
  </script>
</body>
</html>
